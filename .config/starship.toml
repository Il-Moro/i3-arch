add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character"""

[directory]
style = "bold #ffffff"
format = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "dimmed #909090"
format = ' [$symbol$branch]($style)'

[git_status]
style = "#606060"
format = '[ $all_status$ahead_behind]($style) '

[character]
success_symbol = "[❯](#606060)"
error_symbol = "[❯](#f38ba8)"

[cmd_duration]
min_time = 2000
style = "dimmed #505050"
format = ' [󱑍 $duration]($style)'