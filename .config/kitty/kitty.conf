# Font
font_family      JetBrainsMono Nerd Font
font_size        15.0
bold_font        auto
italic_font      auto

# Aspetto
background_opacity 0.85
background #0d0d0d
foreground #d0d0d0

# Palette monocromatica
color0  #1a1a1a
color1  #c0c0c0
color2  #909090
color3  #b0b0b0
color4  #808080
color5  #a0a0a0
color6  #d0d0d0
color7  #e0e0e0
color8  #2a2a2a
color9  #d0d0d0
color10 #a0a0a0
color11 #c0c0c0
color12 #909090
color13 #b0b0b0
color14 #e0e0e0
color15 #ffffff

# Cursore
cursor #ffffff
cursor_shape beam
cursor_beam_thickness 1.5

# Padding
window_padding_width 16

# Niente barra del titolo
hide_window_decorations yes

# Tab bar minimal
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #ffffff
active_tab_background   #1a1a1a
inactive_tab_foreground #505050
inactive_tab_background #0d0d0d