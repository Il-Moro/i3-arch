[manager]
ratio          = [ 1, 3, 4 ]   # Proporzione colonne: [Genitore, Corrente, Anteprima]
sort_by        = "name"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true          # Mostra i file nascosti (i dotfiles!) di default

[preview]
tab_size        = 4
max_width       = 600
max_height      = 900
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15

[opener]
# Definisci come aprire i file (es. i video con mpv, i pdf con zathura o quello che usi)
edit = [
	{ run = '${EDITOR:-nano} "$@"', block = true, for = "unix" }
]
play = [
	{ run = 'mpv "$@"', orphan = true, for = "unix" }
]