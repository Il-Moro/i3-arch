[manager]
ratio          = [ 1, 3, 4 ]
sort_by        = "name"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
tab_size        = 4
max_width       = 600
max_height      = 900
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15

[opener]
edit = [
    { run = '${EDITOR:-nano} "$@"', block = true, for = "unix" }
]
play = [
    { run = 'mpv "$@"', orphan = true, for = "unix" }
]
open = [
    { run = 'xdg-open "$@"', orphan = true, for = "unix" }
]

[input]
cursor_blink = false