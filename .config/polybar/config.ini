[colors]
; Sfondo scuro/nero molto trasparente per l'effetto vetro
background = #1a1e1e24
; Grigio scuro per lo sfondo del desktop attivo
background-alt = #33ffffff
; Bianco puro per i testi principali e le icone attive
foreground = #ffffff
; Grigio chiaro per i prefissi delle icone
primary = #b5b5bc
; Grigio medio per gli elementi disabilitati o spenti
disabled = #70707a
; Rosso vivido per gli errori e notifiche urgenti
alert = #e06c75

[bar/main]
width = 100%
height = 20pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 2
padding-right = 2

module-margin = 2

; Font per il testo
font-0 = "System San Francisco Display:size=11;2"
; Font per le icone (Nerd Fonts / FontAwesome)
font-1 = "Symbols Nerd Font:size=12;2"

; Disposizione dei moduli sulla barra (Logo rimosso per stabilità)
modules-left = xworkspaces
modules-center = date
modules-right = bluetooth pulseaudio memory cpu wlan

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.foreground}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.foreground}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/bluetooth]
type = custom/script
; Cambiati i colori interni dello script per seguire la palette grigio/bianco
exec = if bluetoothctl show | grep -q "Powered: yes"; then echo "%{F#b5b5bc}󰂯%{F-} on"; else echo "%{F#70707a}󰂲%{F-} off"; fi
interval = 3
format-font = 2
click-left = blueman-manager &

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
format-volume-prefix-font = 2
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = "󰖁 Muted"
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.primary}
format-prefix-font = 2
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
format-prefix-font = 2
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
; Il rosso dell'alert entra in gioco se scolleghi il cavo/rete principale
label-disconnected = %{F#e06c75}󰖪 disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#b5b5bc}󰖩 %{F-} %essid%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.foreground}
label-font = 1

[settings]
screenchange-reload = true
pseudo-transparency = true